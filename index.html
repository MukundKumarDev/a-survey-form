<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey Form</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <form id="survey-form">
    <h1 id="title">Only Title
    </h1>
    
    <p id="description">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Nobis ab esse consequatur aliquid
      quidem ullam dolor repellat, sequi quis tenetur?</p>
    
    <label id="name-label" for="name">Name</label>
    <input required id="name" type="text" placeholder="Enter Your name Here">
    <label id="email-label" for="email">Email</label>
    <input required id="email" type="email" placeholder="example@email.com">
    <label id="number-label" for="number">Number</label>
    <input id="number" type="number" min="10" max="12" placeholder="123456670">
    <p>Please tell us what's your current role?</p>
    <select id="dropdown">
      <option>Student</option>
      <option>Working professional</option>
    </select>
    <p>Can you please tell us what's your gender?</p>
    <input type="radio" id="male" value="male" name="gender">
    <label for="male" class="radio-captions">Male</label>
    <input type="radio" id="female" value="female" name="gender">
    <label for="female" class="radio-captions">Female</label>
    <p>Can you please tell us what's your favourite subject?</p>
    
<label for="science" class="checkbox-label">Science</label>
<input type="checkbox" name="favourite-subject" id="science" value="science">


<label for="arts" class="checkbox-label">Arts</label>
<input type="checkbox" name="favourite-subject" id="arts" value="arts"> 


<div class="textarea-group">
  <label for="description" class="textarea-label">Can you please describe yourself?</label>
  <textarea id="description">Please describe yourself here...</textarea>
</div>
    <button type="submit" id="submit">Submit</button>


  </form>
</body>

</html>
